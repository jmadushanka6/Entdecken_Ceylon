<header class="site-header" (keydown.escape)="closeMenu()">
  <div class="container site-header__inner">
    <a class="brand" routerLink="/" aria-label="Entdecken Ceylon – zur Startseite">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="15" fill="currentColor" opacity=".14" />
        <path d="M16 6c4.8 3.6 7 7.4 7 11.3A7 7 0 0 1 16 24a7 7 0 0 1-7-6.7C9 13.4 11.2 9.6 16 6Z" fill="currentColor" />
        <path d="M16 11v15" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8" />
      </svg>
      <span class="brand__name">Entdecken Ceylon</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="hauptnavigation"
    >
      <span class="menu-toggle__icon" aria-hidden="true">{{ isMenuOpen ? '✕' : '☰' }}</span>
      Menü
    </button>

    <nav id="hauptnavigation" class="main-nav" [class.main-nav--open]="isMenuOpen" aria-label="Hauptnavigation">
      <ul>
        <li *ngFor="let item of navItems">
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            ariaCurrentWhenActive="page"
            >{{ item.label }}</a
          >
        </li>
      </ul>
    </nav>

    <button
      class="theme-toggle"
      type="button"
      (click)="themeToggle.emit()"
      [attr.aria-pressed]="isDarkTheme"
      [attr.aria-label]="isDarkTheme ? 'Hellen Modus aktivieren' : 'Dunklen Modus aktivieren'"
      [attr.title]="isDarkTheme ? 'Hellen Modus aktivieren' : 'Dunklen Modus aktivieren'"
    >
      <span aria-hidden="true">{{ isDarkTheme ? '☀️' : '🌙' }}</span>
    </button>
  </div>
</header>
